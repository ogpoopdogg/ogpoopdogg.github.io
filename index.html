<!DOCTYPE html>
<html lang="en" class="auth-pending">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101214">
    <meta name="robots" content="noindex">
    <title>E&amp;C Courier Staff Tools</title>
    <link rel="icon" href="icon-512.png">
    <link rel="apple-touch-icon" href="icon-512.png">
    <style>
        :root {
            --asphalt: #101214;
            --asphalt-2: #171a1d;
            --line: rgba(255, 255, 255, 0.09);
            --muted: #9aa1a9;
            --text: #eef0f2;
            --yellow: #ffcc00;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html { background: var(--asphalt); }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
            background: var(--asphalt);
            -webkit-font-smoothing: antialiased;
        }

        /* Hidden until auth.js confirms an allowed account is signed in */
        .auth-pending body > * { visibility: hidden; }

        .apps {
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: clamp(20px, 6vw, 48px);
        }

        .app {
            width: clamp(96px, 26vw, 148px);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            border-radius: 28%;
            color: var(--yellow);
            background: var(--asphalt-2);
            border: 1px solid var(--line);
            transition: background-color 0.25s var(--ease-out), color 0.25s var(--ease-out), border-color 0.25s, transform 0.3s var(--ease-out);
        }

        .app svg { width: 46%; height: 46%; }

        .apps a:active .app { transform: scale(0.96); }

        .apps a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .app-name {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            font-weight: 600;
            font-size: clamp(0.95rem, 3.6vw, 1.1rem);
            color: var(--text);
        }

        .apps a:hover .app, .apps a:focus-visible .app {
            background: var(--yellow);
            border-color: var(--yellow);
            color: #111;
            transform: translateY(-3px);
        }

        .apps a:focus-visible { outline: none; }

        .signout {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 16px);
            right: 16px;
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            appearance: none;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }

        .signout svg { width: 20px; height: 20px; }

        .signout:hover, .signout:focus-visible { color: var(--yellow); border-color: var(--yellow); outline: none; }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.001ms !important; }
        }
    </style>
</head>
<body>

    <button type="button" class="signout" id="signOut" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/>
            <path d="M10 17l-5-5 5-5M5 12h11"/>
        </svg>
    </button>

    <main>
        <ul class="apps">
            <li>
                <a href="https://app.eandccourier.ca/routehelper/">
                    <span class="app" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M12 21.5s-7-6.2-7-11.5a7 7 0 0 1 14 0c0 5.3-7 11.5-7 11.5z"/>
                            <circle cx="12" cy="10" r="2.6"/>
                        </svg>
                    </span>
                    <span class="app-name">Route Helper</span>
                </a>
            </li>
            <li>
                <a href="https://app.eandccourier.ca/garage/">
                    <span class="app" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14.7 6.3a4 4 0 0 0-5.4 5.1L3.5 17.2a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4 4 0 0 0 5.1-5.4l-2.4 2.4-2.3-.4-.4-2.3z"/>
                        </svg>
                    </span>
                    <span class="app-name">Garage</span>
                </a>
            </li>
            <li>
                <a href="https://app.eandccourier.ca/timeclock/admin.html">
                    <span class="app" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"/>
                            <path d="M12 7v5l3 2"/>
                        </svg>
                    </span>
                    <span class="app-name">Timeclock</span>
                </a>
            </li>
        </ul>
    </main>

    <script type="module">
        const LOGIN = "login/";

        try {
            const { currentAllowedUser, logOut } = await import("./auth.js");
            if (await currentAllowedUser()) {
                document.documentElement.classList.remove("auth-pending");
                document.getElementById("signOut").addEventListener("click", async function () {
                    await logOut();
                    window.location.replace(LOGIN);
                });
            } else {
                window.location.replace(LOGIN);
            }
        } catch (e) {
            window.location.replace(LOGIN);
        }
    </script>
    <script src="update.js"></script>
</body>
</html>
